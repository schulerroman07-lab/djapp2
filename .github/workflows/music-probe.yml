# Kurzer Test: Welche Quellen für frei lizenzierte Musik sind von GitHub aus direkt ladbar?
name: Musik-Quellen prüfen
on:
  push:
    paths:
      - '.github/workflows/music-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quellen prüfen
        run: |
          UA="fadelux-test/1.0 (CI; music test set)"
          probe() { echo "== $1"; curl -sS -L -m 60 -A "$UA" -o /tmp/f.bin -w "status=%{http_code} final=%{url_effective} type=%{content_type} bytes=%{size_download}\n" "$1" || true; file /tmp/f.bin | cut -c1-120; }
          probe "https://freemusicarchive.org/track/razor-unique-tech/stream/"
          probe "https://freemusicarchive.org/track/razor-unique-tech/download/"
          probe "https://prod-1.storage.jamendo.com/?trackid=1890762&format=mp32"
          probe "https://mp3d.jamendo.com/download/track/1890762/mp32/"
          probe "https://commons.wikimedia.org/wiki/Special:FilePath/JoshWoodward-Ashes-01-LetItIn.ogg"
          probe "https://ccmixter.org/api/query?f=json&tags=pop&limit=3&sort=rank"
          probe "https://www.joshwoodward.com/mp3/JoshWoodward-TheWake-03-TheWake.mp3"
          probe "https://archive.org/advancedsearch.php?q=collection%3Anetlabels+AND+subject%3Atechno&fl%5B%5D=identifier&rows=3&output=json"
          cat /tmp/f.bin | head -c 600; echo
          probe "https://ccmixter.org/api/query?f=json&tags=rock+vocals&limit=2"
          head -c 1500 /tmp/f.bin; echo
