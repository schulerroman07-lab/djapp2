# Gerätetest im Android-Emulator (echtes Android, echte Audio-Ausgabe über Oboe):
# Start-Animation, Playlist + Play, Hintergrund-Betrieb, Weiter/Zurück, Gästewunsch,
# Früh-Übergang, Ordnung nach Stimmung und Dauerbetrieb.
# Dauer des Dauerbetriebs: tools/devicetest/minutes.txt (z.B. 120 für 2 Stunden).
# Ergebnis: Artefakt "geraetetest" (Bericht, Bildschirmfotos, Logcat, Bildraten-Statistik).
name: Gerätetest (Emulator)

on:
  push:
    paths:
      - 'app/**'
      - 'tools/devicetest/**'
      - '.github/workflows/device-test.yml'
  workflow_dispatch:

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Hardware-Beschleunigung (KVM) für den Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test-Songs erzeugen (MP3)
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy
          python3 tools/devicetest/make_songs.py songs

      - name: App und Gerätetest bauen
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Gerätetest im Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QEMU_AUDIO_DRV: none
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            mkdir -p out
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell mkdir -p /sdcard/Music/Soak
            adb push songs/. /sdcard/Music/Soak/
            adb shell pm grant app.fadelux android.permission.READ_MEDIA_AUDIO
            adb shell pm grant app.fadelux android.permission.POST_NOTIFICATIONS || true
            adb shell dumpsys battery unplug
            adb logcat -c
            adb shell am instrument -w -e minutes $(cat tools/devicetest/minutes.txt) -e class app.fadelux.DeviceSoakTest app.fadelux.test/androidx.test.runner.AndroidJUnitRunner | tee out/instrument.txt
            adb shell dumpsys gfxinfo app.fadelux > out/gfxinfo.txt || true
            adb shell dumpsys activity services app.fadelux > out/services.txt || true
            adb pull /sdcard/Android/data/app.fadelux/files/soak out/ || true
            adb logcat -d > out/logcat.txt || true
            grep -E "AutoMix|SoakTest|FATAL|AndroidRuntime" out/logcat.txt > out/logcat_kurz.txt || true
            grep -q "OK (1 test)" out/instrument.txt

      - name: Ergebnis hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geraetetest
          path: out/
