# Erzeugt Referenz-Daten (Beats, Downbeats, Gesang) für die echten Test-Songs in tools/realmusic/songs.json
# mit bewährter Analyse-Software. Läuft nur, wenn tools/realmusic/refs_request.txt geändert wird (dauert ca. 1–2 h).
name: Referenzen (echte Musik)
on:
  push:
    paths:
      - 'tools/realmusic/refs_request.txt'
  workflow_dispatch:
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.p.outputs.list }}
      shards: ${{ steps.p.outputs.shards }}
      n: ${{ steps.p.outputs.n }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        # refs_request.txt: "<liste> <anzahl-teile>", z.B. "test 7" oder "dev 12"
        run: |
          read LIST N < tools/realmusic/refs_request.txt
          echo "list=$LIST" >> $GITHUB_OUTPUT
          echo "n=$N" >> $GITHUB_OUTPUT
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($N))))")" >> $GITHUB_OUTPUT
  refs:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Werkzeuge
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "numpy==1.23.5" cython
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q soundfile demucs soxr einops rotary-embedding-torch
          pip install -q https://github.com/CPJKU/beat_this/archive/main.zip || true
          pip install -q git+https://github.com/CPJKU/madmom || pip install -q madmom==0.16.1 || true
          pip install -q "numpy==1.23.5"
          # Modell für Beat This! mit Wiederholungen laden (Server der Uni Linz ist manchmal nicht erreichbar)
          for i in 1 2 3 4 5; do
            curl -sS -L -m 300 -o final0.ckpt "https://cloud.cp.jku.at/public.php/dav/files/7ik4RrBKTS273gp/final0.ckpt" && [ $(stat -c %s final0.ckpt) -gt 1000000 ] && break
            sleep 20
          done
          ls -la final0.ckpt || true
          python3 -c "import madmom; print('madmom', madmom.__version__)" || true
      - name: Referenzen erzeugen
        run: |
          if [ -f final0.ckpt ] && [ $(stat -c %s final0.ckpt) -gt 1000000 ]; then export BEAT_THIS_CKPT=$PWD/final0.ckpt; fi
          python3 tools/realmusic/make_refs.py audio refs_raw --list ${{ needs.plan.outputs.list }} --shard ${{ matrix.shard }}/${{ needs.plan.outputs.n }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refs-${{ matrix.shard }}
          path: refs_raw/
