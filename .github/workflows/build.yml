# Baut die App automatisch auf GitHub bei jedem Hochladen (Push).
# - APK zum direkten Installieren (Release-Seite)
# - AAB für den Google Play Store (Artefakt "Fadelux-AAB")
name: App bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Play-Store-Schlüssel aus den GitHub-Secrets (siehe SIGNING.md). Ohne Secrets: Test-Schlüssel.
      - name: Upload-Schlüssel vorbereiten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then echo "$KEYSTORE_BASE64" | base64 -d > app/upload.keystore; fi
      - name: APK und AAB bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease
      - name: Dateien umbenennen
        run: |
          cp app/build/outputs/apk/release/app-release.apk Fadelux.apk
          cp app/build/outputs/bundle/release/app-release.aab Fadelux.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Fadelux-AAB
          path: Fadelux.aab
      # Direkter Download-Link (immer die neueste Version):
      # https://github.com/<besitzer>/<projekt>/releases/latest/download/Fadelux.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Fadelux 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "Automatisch gebaut aus: ${{ github.event.head_commit.message }}"
          files: |
            Fadelux.apk
            Fadelux.aab
          make_latest: true

  # Bildschirmfotos der Oberfläche (zum Prüfen des Layouts, ohne Handy)
  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Bildschirmfotos erstellen
        run: ./gradlew recordPaparazziDebug
      - name: Bildschirmfotos als Vorabversion ablegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screenshots
          name: Bildschirmfotos (nur zur Kontrolle)
          prerelease: true
          make_latest: false
          files: app/src/test/snapshots/images/*.png
