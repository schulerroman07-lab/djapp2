# Baut die App automatisch auf GitHub bei jedem Hochladen (Push).
# Die fertige APK-Datei findest du unter "Actions" -> letzter Lauf -> "Artifacts".
name: App bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK bauen
        run: ./gradlew assembleRelease --stacktrace
      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk HirschExpressDJ.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HirschExpressDJ-APK
          path: HirschExpressDJ.apk
      # Direkter Download-Link (immer die neueste Version):
      # https://github.com/schulerroman07-lab/djapp2/releases/latest/download/HirschExpressDJ.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Hirsch Express DJ 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: "Automatisch gebaut aus: ${{ github.event.head_commit.message }}"
          files: HirschExpressDJ.apk
          make_latest: true

  # Bildschirmfotos der Oberfläche (zum Prüfen des Layouts, ohne Handy)
  screenshots:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Bildschirmfotos erstellen
        run: ./gradlew recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bildschirmfotos
          path: app/src/test/snapshots/images/
      - name: Bildschirmfotos als Vorabversion ablegen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: screenshots
          name: Bildschirmfotos (nur zur Kontrolle)
          prerelease: true
          make_latest: false
          files: app/src/test/snapshots/images/*.png
