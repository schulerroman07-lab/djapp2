<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Song request</title>
  <style>
    :root { --bg:#101014; --panel:#1b1b22; --text:#ededf2; --dim:#9a9aa8; --accent:#10b981; --ok:#2ecc71; --err:#ff3b3b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    main { max-width:560px; margin:0 auto; padding:16px; }
    h1 { color:var(--accent); font-size:1.6rem; margin:8px 0 2px; text-shadow:0 0 14px #10b98188; }
    .sub { color:var(--dim); margin:0 0 16px; }
    input, textarea { width:100%; font-size:1.05rem; padding:12px; border-radius:10px; border:1px solid #3a3a46; background:var(--panel); color:var(--text); }
    textarea { min-height:80px; resize:vertical; margin-top:12px; }
    ul { list-style:none; padding:0; margin:8px 0; max-height:300px; overflow-y:auto; }
    li { padding:10px 12px; background:var(--panel); border-radius:8px; margin:4px 0; cursor:pointer; }
    li:hover, li.sel { outline:2px solid var(--accent); }
    button { width:100%; margin-top:14px; padding:14px; font-size:1.15rem; font-weight:700; border:0; border-radius:14px; background:var(--accent); color:#000; cursor:pointer; box-shadow:0 0 18px #10b98166; }
    button:disabled { opacity:.5; }
    .msg { margin-top:14px; padding:12px; border-radius:10px; display:none; }
    .msg.ok { display:block; background:#123d24; color:var(--ok); }
    .msg.err { display:block; background:#3d1212; color:var(--err); }
    .chosen { margin-top:10px; color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
<main>
  <h1 id="h">♫</h1>
  <p class="sub" id="eventName"></p>

  <div id="form" style="display:none">
    <input id="search" type="search" placeholder="Song oder Interpret suchen…" autocomplete="off">
    <ul id="results"></ul>
    <div class="chosen" id="chosen"></div>
    <textarea id="text" maxlength="200" placeholder="Oder eigenen Wunsch / Gruss schreiben (optional)"></textarea>
    <button id="send">Wunsch senden</button>
  </div>
  <div class="msg" id="msg"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, writeBatch, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);
  // Texte in der Sprache des Gast-Handys (DE/EN/FR/IT)
  const L = {
    de: { title:"Musikwunsch", search:"Song oder Interpret suchen…", free:"Oder eigenen Wunsch schreiben (optional)", send:"Wunsch senden", noEvent:"Kein Event gefunden. Bitte den QR-Code beim DJ scannen.", inactive:"Dieses Event ist nicht (mehr) aktiv.", chosen:"Gewählt: ", empty:"Bitte einen Song wählen oder etwas schreiben.", thanks:"Danke! Dein Wunsch ist beim DJ angekommen. 🎶", wait:"Nur ein Wunsch alle 5 Minuten – bitte warten.", notFound:"Nicht in der Liste – schreib deinen Wunsch unten ins Textfeld." },
    en: { title:"Song request", search:"Search song or artist…", free:"Or write your own request (optional)", send:"Send request", noEvent:"No event found. Please scan the DJ’s QR code.", inactive:"This event is no longer active.", chosen:"Selected: ", empty:"Please pick a song or write something.", thanks:"Thanks! Your request has reached the DJ. 🎶", wait:"Only one request every 5 minutes – please wait.", notFound:"Not in the list – write your request in the text box below." },
    fr: { title:"Demande de chanson", search:"Rechercher chanson ou artiste…", free:"Ou écrivez votre demande (facultatif)", send:"Envoyer", noEvent:"Aucun événement. Scannez le QR code du DJ.", inactive:"Cet événement n’est plus actif.", chosen:"Choisi : ", empty:"Choisissez une chanson ou écrivez quelque chose.", thanks:"Merci ! Votre demande est arrivée chez le DJ. 🎶", wait:"Une demande toutes les 5 minutes – merci de patienter.", notFound:"Pas dans la liste – écrivez votre demande ci-dessous." },
    it: { title:"Richiesta musicale", search:"Cerca canzone o artista…", free:"Oppure scrivi la tua richiesta (facoltativo)", send:"Invia richiesta", noEvent:"Nessun evento. Scansiona il codice QR del DJ.", inactive:"Questo evento non è più attivo.", chosen:"Scelto: ", empty:"Scegli una canzone o scrivi qualcosa.", thanks:"Grazie! La tua richiesta è arrivata al DJ. 🎶", wait:"Una richiesta ogni 5 minuti – attendi per favore.", notFound:"Non è nella lista – scrivi la richiesta qui sotto." },
  };
  const T = L[(navigator.language || "en").slice(0, 2)] || L.en;
  document.title = T.title; $("h").textContent = "♫ " + T.title;
  $("search").placeholder = T.search; $("text").placeholder = T.free; $("send").textContent = T.send;
  const show = (text, ok) => { const m = $("msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); };
  const COOLDOWN_MS = 5 * 60 * 1000;

  const eventId = new URLSearchParams(location.search).get("e");
  if (!eventId) { show(T.noEvent, false); throw new Error("no event"); }

  // Firebase Hosting liefert die Konfiguration automatisch
  const config = await (await fetch("/__/firebase/init.json")).json();
  const app = initializeApp(config);
  const auth = getAuth(app);
  const db = getFirestore(app);
  await signInAnonymously(auth);

  const ev = await getDoc(doc(db, "events", eventId));
  const expired = ev.exists() && ev.data().expiresAt && ev.data().expiresAt.toDate() < new Date();
  if (!ev.exists() || !ev.data().active || expired) {
    show(T.inactive, false);
    throw new Error("inactive");
  }
  $("eventName").textContent = ev.data().name || "";
  const songs = ev.data().songs || [];
  $("form").style.display = "block";

  let chosen = "";
  const render = () => {
    const q = $("search").value.trim().toLowerCase();
    const list = q.length < 2 ? [] : songs.filter(s => s.toLowerCase().includes(q)).slice(0, 50);
    $("results").innerHTML = "";
    for (const s of list) {
      const li = document.createElement("li");
      li.textContent = s;
      if (s === chosen) li.className = "sel";
      li.onclick = () => { chosen = s; $("chosen").textContent = T.chosen + s; render(); };
      $("results").appendChild(li);
    }
    if (q.length >= 2 && list.length === 0) {
      const li = document.createElement("li");
      li.textContent = T.notFound;
      li.style.cursor = "default";
      $("results").appendChild(li);
    }
  };
  $("search").addEventListener("input", render);

  $("send").onclick = async () => {
    const text = $("text").value.trim();
    if (!chosen && !text) { show(T.empty, false); return; }
    const last = Number(localStorage.getItem("lastWish") || 0);
    const wait = last + COOLDOWN_MS - Date.now();
    if (wait > 0) { show(T.wait, false); return; }

    $("send").disabled = true;
    try {
      const uid = auth.currentUser.uid;
      const batch = writeBatch(db);
      batch.set(doc(db, "events", eventId, "limits", uid), { last: serverTimestamp() });
      batch.set(doc(collection(db, "events", eventId, "requests")), {
        text, song: chosen, createdAt: serverTimestamp(), uid, done: false,
      });
      await batch.commit();
      localStorage.setItem("lastWish", String(Date.now()));
      show(T.thanks, true);
      chosen = ""; $("chosen").textContent = ""; $("text").value = ""; $("search").value = ""; render();
    } catch (e) {
      console.error(e);
      show(T.wait, false);
    }
    $("send").disabled = false;
  };
</script>
</body>
</html>
