<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Musikwunsch – Hirsch Express</title>
  <style>
    :root { --bg:#101014; --panel:#1b1b22; --text:#ededf2; --dim:#9a9aa8; --accent:#ff8a00; --ok:#2ecc71; --err:#ff3b3b; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
    main { max-width:560px; margin:0 auto; padding:16px; }
    h1 { color:var(--accent); font-size:1.6rem; margin:8px 0 2px; }
    .sub { color:var(--dim); margin:0 0 16px; }
    input, textarea { width:100%; font-size:1.05rem; padding:12px; border-radius:10px; border:1px solid #3a3a46; background:var(--panel); color:var(--text); }
    textarea { min-height:80px; resize:vertical; margin-top:12px; }
    ul { list-style:none; padding:0; margin:8px 0; max-height:300px; overflow-y:auto; }
    li { padding:10px 12px; background:var(--panel); border-radius:8px; margin:4px 0; cursor:pointer; }
    li:hover, li.sel { outline:2px solid var(--accent); }
    button { width:100%; margin-top:14px; padding:14px; font-size:1.15rem; font-weight:700; border:0; border-radius:12px; background:var(--accent); color:#000; cursor:pointer; }
    button:disabled { opacity:.5; }
    .msg { margin-top:14px; padding:12px; border-radius:10px; display:none; }
    .msg.ok { display:block; background:#123d24; color:var(--ok); }
    .msg.err { display:block; background:#3d1212; color:var(--err); }
    .chosen { margin-top:10px; color:var(--accent); font-weight:700; }
  </style>
</head>
<body>
<main>
  <h1>🦌 Musikwunsch</h1>
  <p class="sub" id="eventName">Hirsch Express</p>

  <div id="form" style="display:none">
    <input id="search" type="search" placeholder="Song oder Interpret suchen…" autocomplete="off">
    <ul id="results"></ul>
    <div class="chosen" id="chosen"></div>
    <textarea id="text" maxlength="200" placeholder="Oder eigenen Wunsch / Gruss schreiben (optional)"></textarea>
    <button id="send">Wunsch senden</button>
  </div>
  <div class="msg" id="msg"></div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, writeBatch, serverTimestamp }
    from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const $ = (id) => document.getElementById(id);
  const show = (text, ok) => { const m = $("msg"); m.textContent = text; m.className = "msg " + (ok ? "ok" : "err"); };
  const COOLDOWN_MS = 5 * 60 * 1000;

  const eventId = new URLSearchParams(location.search).get("e");
  if (!eventId) { show("Kein Event gefunden. Bitte den QR-Code beim DJ scannen.", false); throw new Error("no event"); }

  // Firebase Hosting liefert die Konfiguration automatisch
  const config = await (await fetch("/__/firebase/init.json")).json();
  const app = initializeApp(config);
  const auth = getAuth(app);
  const db = getFirestore(app);
  await signInAnonymously(auth);

  const ev = await getDoc(doc(db, "events", eventId));
  if (!ev.exists() || !ev.data().active) {
    show("Dieses Event ist nicht (mehr) aktiv.", false);
    throw new Error("inactive");
  }
  $("eventName").textContent = ev.data().name || "Hirsch Express";
  const songs = ev.data().songs || [];
  $("form").style.display = "block";

  let chosen = "";
  const render = () => {
    const q = $("search").value.trim().toLowerCase();
    const list = q.length < 2 ? [] : songs.filter(s => s.toLowerCase().includes(q)).slice(0, 50);
    $("results").innerHTML = "";
    for (const s of list) {
      const li = document.createElement("li");
      li.textContent = s;
      if (s === chosen) li.className = "sel";
      li.onclick = () => { chosen = s; $("chosen").textContent = "Gewählt: " + s; render(); };
      $("results").appendChild(li);
    }
    if (q.length >= 2 && list.length === 0) {
      const li = document.createElement("li");
      li.textContent = "Nicht in der Liste – schreib deinen Wunsch unten ins Textfeld.";
      li.style.cursor = "default";
      $("results").appendChild(li);
    }
  };
  $("search").addEventListener("input", render);

  $("send").onclick = async () => {
    const text = $("text").value.trim();
    if (!chosen && !text) { show("Bitte einen Song wählen oder etwas schreiben.", false); return; }
    const last = Number(localStorage.getItem("lastWish") || 0);
    const wait = last + COOLDOWN_MS - Date.now();
    if (wait > 0) { show(`Bitte warte noch ${Math.ceil(wait / 60000)} Minute(n) bis zum nächsten Wunsch.`, false); return; }

    $("send").disabled = true;
    try {
      const uid = auth.currentUser.uid;
      const batch = writeBatch(db);
      batch.set(doc(db, "events", eventId, "limits", uid), { last: serverTimestamp() });
      batch.set(doc(collection(db, "events", eventId, "requests")), {
        text, song: chosen, createdAt: serverTimestamp(), uid, done: false,
      });
      await batch.commit();
      localStorage.setItem("lastWish", String(Date.now()));
      show("Danke! Dein Wunsch ist beim DJ angekommen. 🎶", true);
      chosen = ""; $("chosen").textContent = ""; $("text").value = ""; $("search").value = ""; render();
    } catch (e) {
      console.error(e);
      show("Senden nicht möglich – du kannst nur alle 5 Minuten einen Wunsch schicken.", false);
    }
    $("send").disabled = false;
  };
</script>
</body>
</html>
